name: testing

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      run_tests:
        description: "Run tests?"
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print input values
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Run tests: ${{ github.event.inputs.run_tests }}"

      - name: Build step
        run: echo "Building for ${{ github.event.inputs.environment }}"

  test:
    name: Test Job
    runs-on: ubuntu-latest
    needs: build

    if: ${{ github.event.inputs.run_tests == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: echo "Running tests in ${{ github.event.inputs.environment }}"
